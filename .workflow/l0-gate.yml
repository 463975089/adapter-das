# Gitee Go pipeline: L0 structural gate (CPU-only, cloud runner OK).
# Enable Gitee Go in repo settings (设置 -> Gitee Go) to activate this file;
# triggers can also be bound in the console. If the schema below has drifted
# from your Gitee Go version, create an empty pipeline in the console and
# paste the stages block -- the substance is the single command:
#   python3 ci/l0_gate.py
version: '1.0'
name: l0-gate
displayName: L0 结构门禁（无 GPU，秒级）
triggers:
  push:
    branches:
      include:
        - master
  pull_request:
    targetBranches:
      include:
        - master
stages:
  - stage:
      name: l0
      displayName: L0 Gate
      steps:
        - step: shell@agent
          name: l0-gate
          displayName: 结构门禁（语法/密钥/文档一致性/引用完整性）
          inputs:
            commands:
              - python3 ci/l0_gate.py
