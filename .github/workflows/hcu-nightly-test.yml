name: HCU Nightly (K8s)

on:
  schedule:
    - cron: '37 14 * * *'
  # 手动触发跑当前所选分支，不提供 ref 输入（无法手动指定）
  workflow_dispatch:
    inputs:
      l2_models:
        description: "L2 模型 id，空格分隔（见 tests/tools/run_model_suite.sh 的 MODELS；单卡池只能跑单卡模型）"
        required: false
        default: "q25-05b q3-32b q3-30b-a3b"
      family_matrix_mode:
        description: "L1.5 五类代表矩阵模式（off|observe|blocking）"
        required: false
        default: "observe"
      pip_index_url:
            description: 'pip index url'
            required: false
            default: ''
      pip_trusted_host:
            description: 'pip trusted host'
            required: false
            default: ''

permissions:
  contents: read

concurrency:
  group: hcu-nightly-${{ github.repository }}
  cancel-in-progress: false

env:
  SGLANG_REPO_URL: ${{ vars.SGLANG_REPO_URL || 'https://github.com/sgl-project/sglang.git' }}
  SGLANG_REF: release/v0.5.22
  PIP_TRUSTED_HOST: ${{ inputs.pip_trusted_host || vars.PIP_TRUSTED_HOST }}
  PIP_INDEX_URL: ${{ inputs.pip_index_url || vars.PIP_INDEX_URL }}

jobs:
  image:
    name: resolve CI image
    # container.image 在检出之前就求值，读不到仓库里的文件；只能先在前置 job 里读出来，再用 needs 传给后两个 job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          # 跟随当前触发分支（已移除 ref 输入，无法手动指定）；
          # 同一 run 内 l15/l2 与 image job ref 一致，镜像和被测代码同源
          persist-credentials: false
          
      - name: Read ci/ci_docker_image
        id: read
        run: |
          set -euo pipefail
          # 这个 workflow 要被 release 线复用，那条分支上的基础设施文件是后补的；
          # 缺失时直接报出来，比 tr 报 "No such file" 更容易定位
          [ -f ci/ci_docker_image ]             || { echo "::error::${{ github.ref_name }} 上没有 ci/ci_docker_image"; exit 1; }
          image="$(tr -d '[:space:]' < ci/ci_docker_image)"
          echo "用镜像: $image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      
  l15:
    name: L1.5 upstream gate (bw1100-1card)
    needs: [image]
    # 给 notify 用的逐段判定（L1: <segment> PASS|FAIL）
    outputs:
      summary: ${{ steps.summary.outputs.json }}
    runs-on: hygon-bw1100-1card
    # 冷 JIT：l15_upstream 约 35 分钟、l15_mech 约 14 分钟，manifest collect 和五类矩阵
    # 每个 case 最多 1200s；再加 30 分钟等卡
    timeout-minutes: 360
    container:
      image: ${{ needs.image.outputs.image }}
    env:
      HCU_L1_TIMEOUT_SCALE: "2"
      L15_MANIFEST_MODE: observe
      L15_FAMILY_MATRIX_MODE: ${{ inputs.family_matrix_mode || 'observe' }}
      L15_RESULT_ROOT: ${{ github.workspace }}/results/l15-manifest
      HCU_CACHE_SEED: /ci_public/adapter-das/cache/hcu_cache_seed.tgz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 同一 run 内与 image job 同一 ref，镜像和被测代码同源
          persist-credentials: false

      - name: reinstall adapter from source tree
        run: |
          set -euo pipefail
          # 容器里 workspace 常以别的 uid 挂进来，git 操作会以 dubious ownership 失败
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # 必须先卸后装——镜像里预装的 dist 认领的是同一批文件，不卸掉会留下一个
          # RECORD 已失效的 dist：它仍然注册 vllm entry-points，之后 pip 卸载它
          # 还会连带删掉本次安装的文件。两条线的打包模型不同，按仓库实际结构分派：
          #   main    : packaging/build.sh 出双 dist（setup_hip.py 编译的 native
          #             sgl-kernel + hcu-adapter，版本带 dtk/torch ABI 标签和构建戳，
          #             两个 dist 精确互锁）
          #   release : 无 packaging/，根 pyproject.toml 出单个纯 python sgl-kernel，
          #             包内同时含 sgl_kernel* + hcu_adapter*
          if [ -x packaging/build.sh ]; then MODEL=dual; else MODEL=single; fi
          echo "打包模型: $MODEL"

          # 上一次运行残留的构建/元数据目录会让 pip 读到过期的 egg-info
          rm -rf build dist ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info

          # 装包期统一 HCU_ADAPTER_HOST=none：sitecustomize 的宿主探测会给每个 python
          # 进程加约 30 秒；未安装时 pip 只打 warning 并以 0 退出
          HCU_ADAPTER_HOST=none python3 -m pip uninstall -y sgl-kernel hcu-adapter

          # 先出 whl 再装：装进去的就是将来分发的同一个包，打包本身的问题
          # （漏文件、版本/entry-point 元数据错）在打包这一步就暴露，而不是等 import/用例
          if [ "$MODEL" = dual ]; then
            HCU_ADAPTER_HOST=none bash packaging/build.sh
          else
            # --no-deps            : torch/triton/packaging 由镜像提供，别让 pip 联网改版本
            # --no-build-isolation : 隔离环境要现下 setuptools，离线节点会直接失败
            HCU_ADAPTER_HOST=none python3 -c 'import setuptools.build_meta' >/dev/null 2>&1 \
              || python3 -m pip install 'setuptools>=64' wheel
            HCU_ADAPTER_HOST=none python3 -m pip wheel \
              --no-deps --no-build-isolation --wheel-dir dist .
          fi
          # 装到测试环境里的 whl 必须各有且只有一个，否则测到的不是本次构建的产物
          shopt -s nullglob
          all_wheels=(dist/*.whl)
          [ ${#all_wheels[@]} -gt 0 ] || { echo "::error::dist/ 下没有 whl 产物"; exit 1; }
          ls -l "${all_wheels[@]}"
          if [ "$MODEL" = dual ]; then
            for n in sgl_kernel hcu_adapter; do
              ws=(dist/${n}-*.whl)
              [ ${#ws[@]} -eq 1 ] || { echo "::error::dist/ 下 ${n} whl 数量为 ${#ws[@]}，预期 1"; exit 1; }
            done
          else
            [ ${#all_wheels[@]} -eq 1 ] || { echo "::error::release 线应只产出 1 个 whl，实际 ${#all_wheels[@]} 个"; exit 1; }
            ws=(dist/sgl_kernel-*.whl)
            [ ${#ws[@]} -eq 1 ] || { echo "::error::单 dist 产物不是 sgl_kernel-*.whl"; exit 1; }
          fi
          # 构建会在源码树留下 sgl_kernel.egg-info / packaging/hcu-adapter/*.egg-info；
          # `python -m pip` 扫描"已安装"时包含当前目录，会把它们当成同版本已安装，
          # 于是直接跳过本次 whl（2026-11-25 nightly 实测：两个 whl 全被跳过，
          # 后面 pip show 拿不到 Location）。安装前必须清掉，dist/ 保留给安装用。
          rm -rf build ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info
          HCU_ADAPTER_HOST=none python3 -m pip install --no-deps --force-reinstall dist/*.whl
          # in-tree 构建会在源码目录留下 build/ 和 *.egg-info；仓库根又在 sys.path 上，
          # 这些元数据会被 importlib.metadata 当成另一个 dist 认领，后面判断版本和
          # “hcu-adapter 是否已消失”时结论会被它们污染，装完就清掉
          rm -rf build dist ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info

          # 以 pip 实际安装位置为准。在 / 下执行、去掉 PYTHONPATH，免得认到源码树里的
          # *.egg-info；sitecustomize 此时已装好，再加 HCU_ADAPTER_HOST=none 压掉它的
          # 启动日志（会打在 stdout 上），用 sed 只取 Location 行
          loc() { (cd / && env -u PYTHONPATH HCU_ADAPTER_HOST=none python3 -m pip show "$1" 2>/dev/null \
            | sed -n 's/^Location: //p'); }
          purelib="$(loc sgl-kernel)"
          [ -n "$purelib" ] || { echo "::error::装完找不到 sgl-kernel 的安装位置"; exit 1; }
          if [ "$MODEL" = dual ]; then
            [ "$purelib" = "$(loc hcu-adapter)" ] \
              || { echo "::error::安装位置异常：'$purelib' vs '$(loc hcu-adapter)'"; exit 1; }
          fi
          # 两条线都要求这三个模块由本次安装提供（release 线的单 dist 全带）
          for p in hcu_adapter/__init__.py sgl_kernel/__init__.py sitecustomize.py; do
            [ -f "$purelib/$p" ] || { echo "::error::安装后 $purelib/$p 不存在"; exit 1; }
          done

          # 两个 job 都会把仓库根放到 PYTHONPATH 最前面（l1_gpu_gate.sh 的 $ROOT、
          # run_model_suite.sh 的 $ADAPTER），而 hcu_adapter/、sgl_kernel/、
          # sitecustomize.py 就躺在仓库根，源码树会盖住刚装的包。不换掉的话这一步
          # 装了什么都被源码顶替，包里少模块也照样绿。tools/ 必须从仓库根导入，
          # 根不能移出路径，所以只把这三个换成指向安装位置的符号链接。
          for p in hcu_adapter sgl_kernel sitecustomize.py; do
            rm -rf "$GITHUB_WORKSPACE/$p"
            ln -s "$purelib/$p" "$GITHUB_WORKSPACE/$p"
          done

          HCU_ADAPTER_HOST=none python3 - "$purelib" "$MODEL" <<'PY'
          import os, sys, importlib.metadata as im
          purelib = os.path.realpath(sys.argv[1])
          model = sys.argv[2]
          import hcu_adapter, sgl_kernel, sitecustomize
          for m in (hcu_adapter, sgl_kernel, sitecustomize):
              real = os.path.realpath(m.__file__)
              assert real.startswith(purelib + os.sep), f"{m.__name__} -> {real}, not under {purelib}"
              print(f"{m.__name__}: {m.__file__} -> {real}")
          print("sgl-kernel", im.version("sgl-kernel"))
          if model == "dual":
              print("hcu-adapter", im.version("hcu-adapter"))
          else:
              # 单 dist 模型下不能再有 hcu-adapter：它和本次的 sgl-kernel 抢同一批文件
              try:
                  stale = im.version("hcu-adapter")
              except im.PackageNotFoundError:
                  print("hcu-adapter: absent (correct for release line)")
              else:
                  raise SystemExit(f"hcu-adapter {stale} still installed; it shadows the install")
              # entry-points 必须由 sgl-kernel 这个 dist 提供
              eps = [e for e in im.entry_points(group="vllm.platform_plugins")
                     if e.name == "hcu_adapter"]
              assert eps, "vllm platform plugin entry-point missing after install"
              owners = {e.dist.name for e in eps if e.dist}
              assert owners == {"sgl-kernel"}, f"entry-point owners: {owners}"
              print("entry-point owner: sgl-kernel")
          PY

      - name: Fetch upstream sglang tree
        run: |
          up=""
          for d in /sglang-v0522 /root/sglang-v0522-src; do
            [ -d "$d/test/registered/attention/unittests" ] && { up="$d"; break; }
          done
          src=image
          if [ -z "$up" ]; then
            src=clone
            # SGLANG_REF 里的 / 不能直接进目录名（release/v0.5.22 -> release-v0.5.22）
            up="$RUNNER_TEMP/sglang-${SGLANG_REF//\//-}"
            rm -rf "$up"
            ok=0
            for i in 1 2 3; do
              if git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$SGLANG_REF" "$SGLANG_REPO_URL" "$up"; then ok=1; break; fi
              echo "clone attempt $i failed"; rm -rf "$up"; sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::拉取上游 sglang 失败：$SGLANG_REPO_URL @ $SGLANG_REF"; exit 1; }
          fi
          head="$(git -C "$up" rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "upstream tree: $up (source=$src, ref=$SGLANG_REF, HEAD=$head)"
          [ -d "$up/test/registered/attention/unittests" ] \
            || { echo "::error::$up 下没有 test/registered/attention/unittests"; exit 1; }
          echo "HCU_UP_TREE=$up" >> "$GITHUB_ENV"

      - name: Seed cache
        run: |
          if [ -f "$HCU_CACHE_SEED" ]; then
            bash ci/cache_import.sh "$HCU_CACHE_SEED"
          else
            echo "no cache seed at $HCU_CACHE_SEED -- cold JIT"
            echo "TVM_FFI_DISABLE_TORCH_C_DLPACK=1" >> "$GITHUB_ENV"
          fi

      - name: L1.5 gate (ci/l1_gpu_gate.sh)
        # 容器里只有分到的那张卡，编号固定为 0
        # tee 留一份给下面的 Summary 解析；pipefail 保证脚本失败不被 tee 的成功掩盖
        run: |
          set -o pipefail
          wget https://nodejs.org/dist/v24.18.0/node-v24.18.0-linux-x64.tar.xz
          tar -xf node-v24.18.0-linux-x64.tar.xz -C /opt
          export PATH="/opt/node-v24.18.0-linux-x64/bin:$PATH"
          bash ci/l1_gpu_gate.sh 0 --up-tree "$HCU_UP_TREE" 2>&1 | tee /tmp/l15_run.log

      - name: Summarize L1.5 results
        id: summary
        if: always()
        run: |
          python3 - /tmp/l15_run.log <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys

          items = {}
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          # "L1: <segment> PASS|FAIL" / "L1: gate <name> PASS|FAIL" / "L1: gates|vendor ..."
          # 段名必须覆盖 ci/l1_gpu_gate.sh 里的全部 segment：l0/cpu/kernels 同样是
          # 独立判定段（它们 FAIL 时脚本 exit 1）。早先只收 l15_*/gates/vendor，
          # 这三个段红了不进明细 —— job 是 ❌，卡片下半截却写"全部通过（N 项）"。
          pat = re.compile(
              r"^L1: (gate \S+|l0|cpu|kernels|l15_\w+|gates|vendor) (PASS|FAIL)\b"
          )
          for line in lines:
              m = pat.match(line)
              if m:
                  items[m.group(1).replace("gate ", "gate:", 1)] = m.group(2)
          # 安全网：脚本的最终裁决 "L1: RED  (kernels gate:x ...)" 列出全部失败段。
          # 将来若新增的 segment 没进上面的段名表，这条也能把它补成 FAIL，不再出现
          # "脚本 RED、明细全绿"的自相矛盾。RED 里的名字与判定行的 key 同形
          # （gate:<name>），用 setdefault 避免覆盖已解析到的状态。
          red = re.compile(r"^L1: RED\s+\(([^)]*)\)")
          for line in lines:
              m = red.match(line)
              if m:
                  for name in m.group(1).split():
                      items.setdefault(name, "FAIL")
          print("json=" + json.dumps({"items": items}, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Collect logs
        if: always()
        run: |
          mkdir -p l15-logs
          cp /tmp/l1_*.log /tmp/hcu_jit_progress.*.log l15-logs/ 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcu-nightly-l15-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            l15-logs/
            results/l15-manifest/
          if-no-files-found: ignore
          retention-days: 7

  vllm-lane:
    name: L1 vLLM host lane (bw1100-1card)
    # vLLM 宿主族车道（ci/vllm_host_lane.sh：每文件新解释器 HCU_ADAPTER_HOST=vllm
    # + VLLM_PLUGINS=none）。存量红清零前 observe（同 L15_MANIFEST_MODE 先例）：
    # 每晚产出完整红绿清单但不挡合并；修复完成后翻 blocking 并同步 pr 车道语义
    needs: [image]
    # 给 notify 用的逐文件判定（VLLM-LANE: <file> PASS|FAIL|EMPTY）
    outputs:
      summary: ${{ steps.summary.outputs.json }}
    runs-on: hygon-bw1100-1card
    timeout-minutes: 150
    container:
      image: ${{ needs.image.outputs.image }}
    env:
      HCU_L1_TIMEOUT_SCALE: "2"
      VLLM_LANE_MODE: observe
      HCU_CACHE_SEED: /ci_public/adapter-das/cache/hcu_cache_seed.tgz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 同一 run 内与 image job 同一 ref
          persist-credentials: false

      - name: reinstall adapter from source tree
        run: |
          set -euo pipefail
          # 容器里 workspace 常以别的 uid 挂进来，git 操作会以 dubious ownership 失败
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # 必须先卸后装——镜像里预装的 dist 认领的是同一批文件，不卸掉会留下一个
          # RECORD 已失效的 dist：它仍然注册 vllm entry-points，之后 pip 卸载它
          # 还会连带删掉本次安装的文件。两条线的打包模型不同，按仓库实际结构分派：
          #   main    : packaging/build.sh 出双 dist（setup_hip.py 编译的 native
          #             sgl-kernel + hcu-adapter，版本带 dtk/torch ABI 标签和构建戳，
          #             两个 dist 精确互锁）
          #   release : 无 packaging/，根 pyproject.toml 出单个纯 python sgl-kernel，
          #             包内同时含 sgl_kernel* + hcu_adapter*
          if [ -x packaging/build.sh ]; then MODEL=dual; else MODEL=single; fi
          echo "打包模型: $MODEL"

          # 上一次运行残留的构建/元数据目录会让 pip 读到过期的 egg-info
          rm -rf build dist ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info

          # 装包期统一 HCU_ADAPTER_HOST=none：sitecustomize 的宿主探测会给每个 python
          # 进程加约 30 秒；未安装时 pip 只打 warning 并以 0 退出
          HCU_ADAPTER_HOST=none python3 -m pip uninstall -y sgl-kernel hcu-adapter

          # 先出 whl 再装：装进去的就是将来分发的同一个包，打包本身的问题
          # （漏文件、版本/entry-point 元数据错）在打包这一步就暴露，而不是等 import/用例
          if [ "$MODEL" = dual ]; then
            HCU_ADAPTER_HOST=none bash packaging/build.sh
          else
            # --no-deps            : torch/triton/packaging 由镜像提供，别让 pip 联网改版本
            # --no-build-isolation : 隔离环境要现下 setuptools，离线节点会直接失败
            HCU_ADAPTER_HOST=none python3 -c 'import setuptools.build_meta' >/dev/null 2>&1 \
              || python3 -m pip install 'setuptools>=64' wheel
            HCU_ADAPTER_HOST=none python3 -m pip wheel \
              --no-deps --no-build-isolation --wheel-dir dist .
          fi
          # 装到测试环境里的 whl 必须各有且只有一个，否则测到的不是本次构建的产物
          shopt -s nullglob
          all_wheels=(dist/*.whl)
          [ ${#all_wheels[@]} -gt 0 ] || { echo "::error::dist/ 下没有 whl 产物"; exit 1; }
          ls -l "${all_wheels[@]}"
          if [ "$MODEL" = dual ]; then
            for n in sgl_kernel hcu_adapter; do
              ws=(dist/${n}-*.whl)
              [ ${#ws[@]} -eq 1 ] || { echo "::error::dist/ 下 ${n} whl 数量为 ${#ws[@]}，预期 1"; exit 1; }
            done
          else
            [ ${#all_wheels[@]} -eq 1 ] || { echo "::error::release 线应只产出 1 个 whl，实际 ${#all_wheels[@]} 个"; exit 1; }
            ws=(dist/sgl_kernel-*.whl)
            [ ${#ws[@]} -eq 1 ] || { echo "::error::单 dist 产物不是 sgl_kernel-*.whl"; exit 1; }
          fi
          # 构建会在源码树留下 sgl_kernel.egg-info / packaging/hcu-adapter/*.egg-info；
          # `python -m pip` 扫描"已安装"时包含当前目录，会把它们当成同版本已安装，
          # 于是直接跳过本次 whl（2026-11-25 nightly 实测：两个 whl 全被跳过，
          # 后面 pip show 拿不到 Location）。安装前必须清掉，dist/ 保留给安装用。
          rm -rf build ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info
          HCU_ADAPTER_HOST=none python3 -m pip install --no-deps --force-reinstall dist/*.whl
          # in-tree 构建会在源码目录留下 build/ 和 *.egg-info；仓库根又在 sys.path 上，
          # 这些元数据会被 importlib.metadata 当成另一个 dist 认领，后面判断版本和
          # “hcu-adapter 是否已消失”时结论会被它们污染，装完就清掉
          rm -rf build dist ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info

          # 以 pip 实际安装位置为准。在 / 下执行、去掉 PYTHONPATH，免得认到源码树里的
          # *.egg-info；sitecustomize 此时已装好，再加 HCU_ADAPTER_HOST=none 压掉它的
          # 启动日志（会打在 stdout 上），用 sed 只取 Location 行
          loc() { (cd / && env -u PYTHONPATH HCU_ADAPTER_HOST=none python3 -m pip show "$1" 2>/dev/null \
            | sed -n 's/^Location: //p'); }
          purelib="$(loc sgl-kernel)"
          [ -n "$purelib" ] || { echo "::error::装完找不到 sgl-kernel 的安装位置"; exit 1; }
          if [ "$MODEL" = dual ]; then
            [ "$purelib" = "$(loc hcu-adapter)" ] \
              || { echo "::error::安装位置异常：'$purelib' vs '$(loc hcu-adapter)'"; exit 1; }
          fi
          # 两条线都要求这三个模块由本次安装提供（release 线的单 dist 全带）
          for p in hcu_adapter/__init__.py sgl_kernel/__init__.py sitecustomize.py; do
            [ -f "$purelib/$p" ] || { echo "::error::安装后 $purelib/$p 不存在"; exit 1; }
          done

          # 两个 job 都会把仓库根放到 PYTHONPATH 最前面（l1_gpu_gate.sh 的 $ROOT、
          # run_model_suite.sh 的 $ADAPTER），而 hcu_adapter/、sgl_kernel/、
          # sitecustomize.py 就躺在仓库根，源码树会盖住刚装的包。不换掉的话这一步
          # 装了什么都被源码顶替，包里少模块也照样绿。tools/ 必须从仓库根导入，
          # 根不能移出路径，所以只把这三个换成指向安装位置的符号链接。
          for p in hcu_adapter sgl_kernel sitecustomize.py; do
            rm -rf "$GITHUB_WORKSPACE/$p"
            ln -s "$purelib/$p" "$GITHUB_WORKSPACE/$p"
          done

          HCU_ADAPTER_HOST=none python3 - "$purelib" "$MODEL" <<'PY'
          import os, sys, importlib.metadata as im
          purelib = os.path.realpath(sys.argv[1])
          model = sys.argv[2]
          import hcu_adapter, sgl_kernel, sitecustomize
          for m in (hcu_adapter, sgl_kernel, sitecustomize):
              real = os.path.realpath(m.__file__)
              assert real.startswith(purelib + os.sep), f"{m.__name__} -> {real}, not under {purelib}"
              print(f"{m.__name__}: {m.__file__} -> {real}")
          print("sgl-kernel", im.version("sgl-kernel"))
          if model == "dual":
              print("hcu-adapter", im.version("hcu-adapter"))
          else:
              # 单 dist 模型下不能再有 hcu-adapter：它和本次的 sgl-kernel 抢同一批文件
              try:
                  stale = im.version("hcu-adapter")
              except im.PackageNotFoundError:
                  print("hcu-adapter: absent (correct for release line)")
              else:
                  raise SystemExit(f"hcu-adapter {stale} still installed; it shadows the install")
              # entry-points 必须由 sgl-kernel 这个 dist 提供
              eps = [e for e in im.entry_points(group="vllm.platform_plugins")
                     if e.name == "hcu_adapter"]
              assert eps, "vllm platform plugin entry-point missing after install"
              owners = {e.dist.name for e in eps if e.dist}
              assert owners == {"sgl-kernel"}, f"entry-point owners: {owners}"
              print("entry-point owner: sgl-kernel")
          PY

      - name: Seed cache
        run: |
          if [ -f "$HCU_CACHE_SEED" ]; then
            bash ci/cache_import.sh "$HCU_CACHE_SEED"
          else
            echo "no cache seed at $HCU_CACHE_SEED -- cold JIT"
            echo "TVM_FFI_DISABLE_TORCH_C_DLPACK=1" >> "$GITHUB_ENV"
          fi

      - name: vLLM host lane (ci/vllm_host_lane.sh)
        # 容器里只有分到的那张卡，编号固定为 0
        # tee 留一份给下面的 Summary 解析；pipefail 保证脚本失败不被 tee 的成功掩盖
        run: |
          set -o pipefail
          bash ci/vllm_host_lane.sh 0 2>&1 | tee /tmp/l1_vllm_lane.log

      - name: Summarize vLLM lane results
        id: summary
        if: always()
        run: |
          python3 - /tmp/l1_vllm_lane.log <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys

          items = {}
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          # "VLLM-LANE: <file> PASS|FAIL|EMPTY"
          pat = re.compile(r"^VLLM-LANE: (\S+) (PASS|FAIL|EMPTY)\b")
          for line in lines:
              m = pat.match(line)
              if m:
                  items[m.group(1)] = m.group(2)
          print("json=" + json.dumps({"items": items}, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Collect logs
        if: always()
        run: |
          mkdir -p vllm-lane-logs
          cp /tmp/l1_vllm_*.log vllm-lane-logs/ 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcu-nightly-vllm-lane-${{ github.run_id }}-${{ github.run_attempt }}
          path: vllm-lane-logs/
          if-no-files-found: ignore
          retention-days: 7

  l2:
    name: L2 e2e model suite (bw1100-4card)
    needs: [image]
    # 给 notify 用的机器可读判定（id -> {G1..G4: PASS/FAIL}），由下面 Summary 步骤产出
    outputs:
      models: ${{ steps.summary.outputs.models_json }}
    runs-on: hygon-bw1100-4card
    # 每个模型最多等 1500s 启动 + 四判定；再加 30 分钟等卡
    timeout-minutes: 720
    container:
      image: ${{ needs.image.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      L2_MODELS: ${{ inputs.l2_models || 'q25-05b q3-32b q3-30b-a3b' }}
      LOGD: /root/logs/model_suite
    steps:
      - uses: actions/checkout@v4
        with:
          # 同一 run 内与 image job 同一 ref，镜像和被测代码同源
          persist-credentials: false

      - name: reinstall adapter from source tree
        run: |
          set -euo pipefail
          # 容器里 workspace 常以别的 uid 挂进来，git 操作会以 dubious ownership 失败
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # 必须先卸后装——镜像里预装的 dist 认领的是同一批文件，不卸掉会留下一个
          # RECORD 已失效的 dist：它仍然注册 vllm entry-points，之后 pip 卸载它
          # 还会连带删掉本次安装的文件。两条线的打包模型不同，按仓库实际结构分派：
          #   main    : packaging/build.sh 出双 dist（setup_hip.py 编译的 native
          #             sgl-kernel + hcu-adapter，版本带 dtk/torch ABI 标签和构建戳，
          #             两个 dist 精确互锁）
          #   release : 无 packaging/，根 pyproject.toml 出单个纯 python sgl-kernel，
          #             包内同时含 sgl_kernel* + hcu_adapter*
          if [ -x packaging/build.sh ]; then MODEL=dual; else MODEL=single; fi
          echo "打包模型: $MODEL"

          # 上一次运行残留的构建/元数据目录会让 pip 读到过期的 egg-info
          rm -rf build dist ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info

          # 装包期统一 HCU_ADAPTER_HOST=none：sitecustomize 的宿主探测会给每个 python
          # 进程加约 30 秒；未安装时 pip 只打 warning 并以 0 退出
          HCU_ADAPTER_HOST=none python3 -m pip uninstall -y sgl-kernel hcu-adapter

          # 先出 whl 再装：装进去的就是将来分发的同一个包，打包本身的问题
          # （漏文件、版本/entry-point 元数据错）在打包这一步就暴露，而不是等 import/用例
          if [ "$MODEL" = dual ]; then
            HCU_ADAPTER_HOST=none bash packaging/build.sh
          else
            # --no-deps            : torch/triton/packaging 由镜像提供，别让 pip 联网改版本
            # --no-build-isolation : 隔离环境要现下 setuptools，离线节点会直接失败
            HCU_ADAPTER_HOST=none python3 -c 'import setuptools.build_meta' >/dev/null 2>&1 \
              || python3 -m pip install 'setuptools>=64' wheel
            HCU_ADAPTER_HOST=none python3 -m pip wheel \
              --no-deps --no-build-isolation --wheel-dir dist .
          fi
          # 装到测试环境里的 whl 必须各有且只有一个，否则测到的不是本次构建的产物
          shopt -s nullglob
          all_wheels=(dist/*.whl)
          [ ${#all_wheels[@]} -gt 0 ] || { echo "::error::dist/ 下没有 whl 产物"; exit 1; }
          ls -l "${all_wheels[@]}"
          if [ "$MODEL" = dual ]; then
            for n in sgl_kernel hcu_adapter; do
              ws=(dist/${n}-*.whl)
              [ ${#ws[@]} -eq 1 ] || { echo "::error::dist/ 下 ${n} whl 数量为 ${#ws[@]}，预期 1"; exit 1; }
            done
          else
            [ ${#all_wheels[@]} -eq 1 ] || { echo "::error::release 线应只产出 1 个 whl，实际 ${#all_wheels[@]} 个"; exit 1; }
            ws=(dist/sgl_kernel-*.whl)
            [ ${#ws[@]} -eq 1 ] || { echo "::error::单 dist 产物不是 sgl_kernel-*.whl"; exit 1; }
          fi
          # 构建会在源码树留下 sgl_kernel.egg-info / packaging/hcu-adapter/*.egg-info；
          # `python -m pip` 扫描"已安装"时包含当前目录，会把它们当成同版本已安装，
          # 于是直接跳过本次 whl（2026-11-25 nightly 实测：两个 whl 全被跳过，
          # 后面 pip show 拿不到 Location）。安装前必须清掉，dist/ 保留给安装用。
          rm -rf build ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info
          HCU_ADAPTER_HOST=none python3 -m pip install --no-deps --force-reinstall dist/*.whl
          # in-tree 构建会在源码目录留下 build/ 和 *.egg-info；仓库根又在 sys.path 上，
          # 这些元数据会被 importlib.metadata 当成另一个 dist 认领，后面判断版本和
          # “hcu-adapter 是否已消失”时结论会被它们污染，装完就清掉
          rm -rf build dist ./*.egg-info packaging/hcu-adapter/build packaging/hcu-adapter/*.egg-info

          # 以 pip 实际安装位置为准。在 / 下执行、去掉 PYTHONPATH，免得认到源码树里的
          # *.egg-info；sitecustomize 此时已装好，再加 HCU_ADAPTER_HOST=none 压掉它的
          # 启动日志（会打在 stdout 上），用 sed 只取 Location 行
          loc() { (cd / && env -u PYTHONPATH HCU_ADAPTER_HOST=none python3 -m pip show "$1" 2>/dev/null \
            | sed -n 's/^Location: //p'); }
          purelib="$(loc sgl-kernel)"
          [ -n "$purelib" ] || { echo "::error::装完找不到 sgl-kernel 的安装位置"; exit 1; }
          if [ "$MODEL" = dual ]; then
            [ "$purelib" = "$(loc hcu-adapter)" ] \
              || { echo "::error::安装位置异常：'$purelib' vs '$(loc hcu-adapter)'"; exit 1; }
          fi
          # 两条线都要求这三个模块由本次安装提供（release 线的单 dist 全带）
          for p in hcu_adapter/__init__.py sgl_kernel/__init__.py sitecustomize.py; do
            [ -f "$purelib/$p" ] || { echo "::error::安装后 $purelib/$p 不存在"; exit 1; }
          done

          # 两个 job 都会把仓库根放到 PYTHONPATH 最前面（l1_gpu_gate.sh 的 $ROOT、
          # run_model_suite.sh 的 $ADAPTER），而 hcu_adapter/、sgl_kernel/、
          # sitecustomize.py 就躺在仓库根，源码树会盖住刚装的包。不换掉的话这一步
          # 装了什么都被源码顶替，包里少模块也照样绿。tools/ 必须从仓库根导入，
          # 根不能移出路径，所以只把这三个换成指向安装位置的符号链接。
          for p in hcu_adapter sgl_kernel sitecustomize.py; do
            rm -rf "$GITHUB_WORKSPACE/$p"
            ln -s "$purelib/$p" "$GITHUB_WORKSPACE/$p"
          done

          HCU_ADAPTER_HOST=none python3 - "$purelib" "$MODEL" <<'PY'
          import os, sys, importlib.metadata as im
          purelib = os.path.realpath(sys.argv[1])
          model = sys.argv[2]
          import hcu_adapter, sgl_kernel, sitecustomize
          for m in (hcu_adapter, sgl_kernel, sitecustomize):
              real = os.path.realpath(m.__file__)
              assert real.startswith(purelib + os.sep), f"{m.__name__} -> {real}, not under {purelib}"
              print(f"{m.__name__}: {m.__file__} -> {real}")
          print("sgl-kernel", im.version("sgl-kernel"))
          if model == "dual":
              print("hcu-adapter", im.version("hcu-adapter"))
          else:
              # 单 dist 模型下不能再有 hcu-adapter：它和本次的 sgl-kernel 抢同一批文件
              try:
                  stale = im.version("hcu-adapter")
              except im.PackageNotFoundError:
                  print("hcu-adapter: absent (correct for release line)")
              else:
                  raise SystemExit(f"hcu-adapter {stale} still installed; it shadows the install")
              # entry-points 必须由 sgl-kernel 这个 dist 提供
              eps = [e for e in im.entry_points(group="vllm.platform_plugins")
                     if e.name == "hcu_adapter"]
              assert eps, "vllm platform plugin entry-point missing after install"
              owners = {e.dist.name for e in eps if e.dist}
              assert owners == {"sgl-kernel"}, f"entry-point owners: {owners}"
              print("entry-point owner: sgl-kernel")
          PY

      - name: Fetch upstream sglang tree
        run: |
          up=""
          for d in /sglang-v0522 /root/sglang-v0522-src; do
            [ -d "$d/python/sglang" ] && { up="$d"; break; }
          done
          src=image
          if [ -z "$up" ]; then
            src=clone
            # SGLANG_REF 里的 / 不能直接进目录名（release/v0.5.22 -> release-v0.5.22）
            up="$RUNNER_TEMP/sglang-${SGLANG_REF//\//-}"
            rm -rf "$up"
            ok=0
            for i in 1 2 3; do
              if git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$SGLANG_REF" "$SGLANG_REPO_URL" "$up"; then ok=1; break; fi
              echo "clone attempt $i failed"; rm -rf "$up"; sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::拉取上游 sglang 失败：$SGLANG_REPO_URL @ $SGLANG_REF"; exit 1; }
          fi
          head="$(git -C "$up" rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "upstream tree: $up (source=$src, ref=$SGLANG_REF, HEAD=$head)"
          echo "HCU_UP_TREE=$up" >> "$GITHUB_ENV"

      - name: Pre-check
        run: |
          set -x
          # run_model_suite.sh 用 /opt/dtk/bin/rocm-smi 查空闲显存来选卡；查不到会一直
          # sleep 120 等下去，所以这里先确认能看到 HCU[0]，看不到就直接失败
          /opt/dtk/bin/rocm-smi --showmeminfo vram | grep -q 'HCU\[0\]' \
            || { echo "::error::rocm-smi 看不到 HCU[0]"; exit 1; }
          ls -d /public/opendas/DL_DATA/llm-models \
            || { echo "::error::/public 下没有模型目录"; exit 1; }
          # 脚本会设 PYTHONPATH=$ADAPTER:$SGLANG_V0521（变量名沿用旧版本，实际是 v0522 树）
          echo "ADAPTER=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "SGLANG_V0521=$HCU_UP_TREE/python" >> "$GITHUB_ENV"

      - name: L2 model suite
        run: bash tests/tools/run_model_suite.sh $L2_MODELS

      - name: Verdict
        run: |
          rc=0
          for id in $L2_MODELS; do
            f="$LOGD/result_$id.txt"
            echo "::group::$id"; cat "$f" 2>/dev/null || echo "(no result file)"; echo "::endgroup::"
            for g in G2-generation G3-precision G4-long; do
              if grep -q "^$g PASS" "$f" 2>/dev/null; then
                echo "$id $g PASS"
              else
                echo "::error::$id $g not PASS"; rc=1
              fi
            done
          done
          exit $rc

      - name: Summarize L2 results
        id: summary
        # Verdict 失败也要汇总，否则通知里只剩一个 failure、看不到是哪个门不过
        if: always()
        run: |
          python3 - "$L2_MODELS" "$LOGD" <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          gates = ("G1-launch", "G2-generation", "G3-precision", "G4-long")
          out = {}
          for mid in sys.argv[1].split():
              state = {}
              try:
                  lines = open(
                      os.path.join(sys.argv[2], f"result_{mid}.txt"),
                      encoding="utf-8", errors="replace",
                  ).read().splitlines()
              except OSError:
                  lines = []
              for line in lines:
                  for g in gates:
                      if g in line:
                          state[g] = "PASS" if "PASS" in line else "FAIL"
              out[mid] = state
          print("models_json=" + json.dumps(out, ensure_ascii=False, separators=(",", ":")))
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hcu-nightly-l2-${{ github.run_id }}-${{ github.run_attempt }}
          path: /root/logs/model_suite/
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: Feishu card
    # 判定已由各测试 job 完成；这里只负责透出，任务失败/取消时也要发
    if: always()
    needs: [l15, vllm-lane, l2]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Send Feishu card
        env:
          # 群机器人 webhook 放仓库 secret；未配置时脚本只打印卡片 JSON 并退出 0
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          # 机器人开启"签名校验"时再配这个；留空则不带 timestamp/sign
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          L2_MODELS: ${{ inputs.l2_models || 'q25-05b q3-32b q3-30b-a3b' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 ci/feishu_notify.py
